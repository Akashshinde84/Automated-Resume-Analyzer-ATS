name: QA
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  production-container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: docker build -t resume-api-qa backend
      - name: Start isolated production container
        run: >-
          docker run -d --name resume-api-qa --memory=2g --cpus=1 --pids-limit=128
          --cap-drop=ALL --security-opt=no-new-privileges
          -p 8000:10000 -e PORT=10000 -e DEPLOYMENT_ENVIRONMENT=production
          -e APP_MODE=single_user -e SINGLE_USER_API_KEY=ci-container-disposable-token-000000000000
          -e REPORT_SIGNING_KEY=ci-container-signing-secret-000000000000
          -e REQUIRE_NER_MODEL=true -e ISOLATE_PARSING=true -e MAX_CONCURRENT_PROCESSING=1
          -e 'CORS_ORIGINS=["https://frontend.example.test"]'
          -e 'ALLOWED_HOSTS=["localhost","127.0.0.1"]' resume-api-qa
      - name: Verify container startup and actual pipeline
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8000/health; then break; fi
            sleep 2
          done
          docker cp backend/scripts/production_smoke.py resume-api-qa:/tmp/production_smoke.py
          docker exec -e SMOKE_API_URL=http://127.0.0.1:10000 \
            -e SMOKE_FRONTEND_ORIGIN=https://frontend.example.test \
            -e SMOKE_API_KEY=ci-container-disposable-token-000000000000 \
            resume-api-qa python /tmp/production_smoke.py --allow-local
      - if: always()
        run: docker rm -f resume-api-qa
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: resume_qa
          POSTGRES_USER: postgres
          # Disposable CI container only; not a deployment credential.
          POSTGRES_PASSWORD: ci_disposable_only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Used solely to create/drop random test schemas in the disposable container.
      TEST_POSTGRES_URL: postgresql+psycopg://postgres:ci_disposable_only@localhost:5432/resume_qa
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install --upgrade 'pip>=26.2'
      - run: python -m pip install -r backend/requirements-qa.txt
      - run: python -m spacy download en_core_web_sm
      - run: python backend/scripts/check_secrets.py
      - run: python -m bandit -r backend/app -ll
      - run: python -m pip_audit --local --progress-spinner off
      - run: python -m pip check
      - run: python -m pytest -q
        working-directory: backend
      - run: python backend/scripts/evaluate_nlp.py
      - run: python backend/scripts/evaluate_matching.py
      - run: python backend/scripts/evaluate_relevance.py
  frontend-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install --upgrade 'pip>=26.2'
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m spacy download en_core_web_sm
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm run format:check && npm test && npm run build
        working-directory: frontend
      - run: npm audit --audit-level=moderate
        working-directory: frontend
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium
        working-directory: frontend
      - run: python backend/scripts/e2e_frontend.py
